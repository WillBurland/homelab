x-common-env: &common_env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-service: &common_service
  networks:
    - homelab_network
  restart: unless-stopped

name: homelab-applications
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    <<: *common_service
    environment:
      <<: *common_env
      HOMEPAGE_ALLOWED_HOSTS: ${SERVER_IP}:${HOMEPAGE_PORT},home.${SERVER_DOMAIN}
    ports:
      - ${HOMEPAGE_PORT}:3000
    volumes:
      - ${CONFIG_ROOT}/homepage/config:/app/config
      - ${NAS}:${NAS}
      - /var/run/docker.sock:/var/run/docker.sock:ro

  immich:
    image: ghcr.io/immich-app/immich-server:release
    <<: *common_service
    environment:
      <<: *common_env
      DB_HOSTNAME: immich-postgres
      DB_DATABASE_NAME: immich
      DB_USERNAME: immich
      DB_PASSWORD: immich
      REDIS_HOSTNAME: immich-redis
    ports:
      - ${IMMICH_PORT}:2283
    volumes:
      - ${CONFIG_ROOT}/immich-server/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-postgres

  immich-ml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    <<: *common_service
    environment:
      <<: *common_env
    volumes:
      - ${CONFIG_ROOT}/immich-ml/cache:/cache

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    <<: *common_service
    environment:
      <<: *common_env
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${CONFIG_ROOT}/immich-postgres/data:/var/lib/postgresql/data
    shm_size: 128m

  immich-redis:
    image: docker.io/valkey/valkey:9
    <<: *common_service
    environment:
      <<: *common_env
    healthcheck:
      test: redis-cli ping || exit 1

  pacoloco:
    image: ghcr.io/anatol/pacoloco:latest
    <<: *common_service
    environment:
      <<: *common_env
    user: "${PUID}:${PGID}"
    ports:
      - ${PACOLOCO_PORT}:9129
    volumes:
      - ${CONFIG_ROOT}/pacoloco/cache:/var/cache/pacoloco
      - ${CONFIG_ROOT}/pacoloco/config/pacoloco.yaml:/etc/pacoloco.yaml

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${SYNCTHING_PORT_UI}:8384
      - ${SYNCTHING_PORT_TRAFFIC}:22000
      - ${SYNCTHING_PORT_TRAFFIC}:22000/udp
      - ${SYNCTHING_PORT_DISCOVERY}:21027/udp
    volumes:
      - ${CONFIG_ROOT}/syncthing/config:/config

  vaultwarden:
    image: vaultwarden/server:latest
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${VAULTWARDEN_PORT}:80
    volumes:
      - ${CONFIG_ROOT}/vaultwarden/data:/data

  wud:
    image: getwud/wud:latest
    <<: *common_service
    environment:
      <<: *common_env
      WUD_TRIGGER_DOCKER_UPDATE_AUTO: false
      WUD_TRIGGER_DOCKER_UPDATE_PRUNE: true
      WUD_WATCHER_DOCKER_CRON: 0 3 * * *
      WUD_REGISTRY_HUB_PUBLIC_LOGIN: ${WUD_HUB_USERNAME}
      WUD_REGISTRY_HUB_PUBLIC_PASSWORD: ${WUD_HUB_TOKEN}
      WUD_REGISTRY_LSCR_PUBLIC_USERNAME: ${WUD_LSCR_USERNAME}
      WUD_REGISTRY_LSCR_PUBLIC_TOKEN: ${WUD_LSCR_TOKEN}
    ports:
      - ${WUD_PORT}:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:latest
    <<: *common_service
    privileged: true
    environment:
      <<: *common_env
      APP_SECRET: ${ZEROBYTE_SECRET}
      BASE_URL: http://${SERVER_IP}:${ZEROBYTE_PORT}
      TRUSTED_ORIGINS: https://zerobyte.${SERVER_DOMAIN}
      ENABLE_DEV_PANEL: true
      LOG_LEVEL: debug
    ports:
      - ${ZEROBYTE_PORT}:4096
    volumes:
      - ${CONFIG_ROOT}/zerobyte/data:/var/lib/zerobyte
      - ${NAS}:${NAS}
      - ${APPS}:${APPS}
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN

networks:
  homelab_network:
    external: true
