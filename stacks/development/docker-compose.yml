x-common-env: &common_env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-service: &common_service
  networks:
    - homelab_network
  restart: unless-stopped
  extra_hosts:
    - "authentik.${SERVER_DOMAIN}:${SERVER_IP}"

x-healthcheck-defaults: &healthcheck_defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-watchtower-auto-update: &auto_update
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.cooldown-delay: "24h"

x-watchtower-monitor-only: &monitor_updates_only
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.monitor-only: "true"

x-watchtower-pinned: &pinned_version
  com.centurylinklabs.watchtower.enable: "false"

name: homelab-development
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    mac_address: "0E:01:01:00:00:00"
    labels:
      <<: *pinned_version
    <<: *common_service
    environment:
      <<: *common_env
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: ${SERVER_IP}:${FORGEJO_DB_PORT}
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: forgejo
    ports:
      - ${FORGEJO_PORT_WEB}:3000
      - ${FORGEJO_PORT_SSH}:22
    volumes:
      - ${CONFIG_ROOT}/forgejo/data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/healthz"]
      start_period: 60s
    depends_on:
      forgejo-db:
        condition: service_healthy

  forgejo-db:
    image: postgres:14
    container_name: forgejo-db
    mac_address: "0E:01:02:00:00:00"
    labels:
      <<: *pinned_version
    <<: *common_service
    environment:
      <<: *common_env
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: forgejo
      POSTGRES_DB: forgejo
    ports:
      - ${FORGEJO_DB_PORT}:5432
    volumes:
      - ${CONFIG_ROOT}/forgejo-db/data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]

networks:
  homelab_network:
    external: true
