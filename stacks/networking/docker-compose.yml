x-common-env: &common_env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-service: &common_service
  networks:
    - homelab_network
  restart: unless-stopped
  extra_hosts:
    - "authentik.${SERVER_DOMAIN}:${SERVER_IP}"

x-healthcheck-defaults: &healthcheck_defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-watchtower-auto-update: &auto_update
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.cooldown-delay: "24h"

x-watchtower-monitor-only: &monitor_updates_only
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.monitor-only: "true"

x-watchtower-pinned: &pinned_version
  com.centurylinklabs.watchtower.enable: "false"

name: homelab-networking
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: cloudflared
    mac_address: "1A:01:01:00:00:00"
    labels:
      <<: *pinned_version
    <<: *common_service
    environment:
      <<: *common_env
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      TUNNEL_METRICS: "0.0.0.0:60123"
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:60123", "ready"]
    command:
      - "tunnel"
      - "--protocol=http2"
      - "run"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    mac_address: "1A:02:01:00:00:00"
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
      LOG_LEVEL: info
      LOG_HTML: false
      CAPTCHA_SOLVER: none
    ports:
      - ${FLARESOLVERR_PORT}:8191
    volumes:
      - ${CONFIG_ROOT}/flaresolverr/config:/config
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8191/health"]
      start_period: 60s

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2
    container_name: nginx-proxy-manager
    mac_address: "1A:03:01:00:00:00"
    labels:
      <<: *monitor_updates_only
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${NGINX_PORT_HTTP}:80
      - ${NGINX_PORT_HTTPS}:443
      - ${NGINX_PORT_UI}:81
    volumes:
      - ${CONFIG_ROOT}/nginx-proxy-manager/data:/data
      - ${CONFIG_ROOT}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/usr/bin/check-health"]
      start_period: 120s

  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    mac_address: "1A:04:01:00:00:00"
    labels:
      <<: *pinned_version
    <<: *common_service
    environment:
      <<: *common_env
      FTLCONF_webserver_api_app_sudo: true
    ports:
      - ${PIHOLE_PORT_DNS}:53
      - ${PIHOLE_PORT_DNS}:53/udp
      - ${PIHOLE_PORT_HTTP_UI}:80
      - ${PIHOLE_PORT_HTTPS_UI}:443
    volumes:
      - ${CONFIG_ROOT}/pihole/data:/etc/pihole

  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    mac_address: "1A:05:01:00:00:00"
    labels:
      <<: *pinned_version
    <<: *common_service
    environment:
      <<: *common_env
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY}
      TS_HOSTNAME: ${SERVER_HOSTNAME}
      TS_ROUTES: 192.168.0.0/24
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ${CONFIG_ROOT}/tailscale/data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "tailscale", "status"]
    cap_add:
      - NET_ADMIN

networks:
  homelab_network:
    external: true
