x-common-env: &common_env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-service: &common_service
  networks:
    - homelab_network
  restart: unless-stopped
  extra_hosts:
    - "authentik.${SERVER_DOMAIN}:${SERVER_IP}"

x-watchtower-auto-update: &auto_update
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.cooldown-delay: "24h"

x-watchtower-monitor-only: &monitor_updates_only
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.monitor-only: "true"

x-watchtower-pinned: &pinned_version
  com.centurylinklabs.watchtower.enable: "false"

name: homelab-media
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${BAZARR_PORT}:6767
    volumes:
      - ${CONFIG_ROOT}/bazarr/config:/config
      - ${NAS}:${NAS}

  fileflows:
    image: revenz/fileflows
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${FILEFLOWS_PORT}:5000
    volumes:
      - ${CONFIG_ROOT}/fileflows/data:/app/Data
      - ${CONFIG_ROOT}/fileflows/temp:/temp
      - ${NAS}:${NAS}
      - /var/run/docker.sock:/var/run/docker.sock:ro

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
      AUTO_UPDATE: true
      RUN_OPTS:
    ports:
      - ${JACKETT_PORT}:9117
    volumes:
      - ${CONFIG_ROOT}/jackett/config:/config

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    labels:
      <<: *pinned_version
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${JELLYFIN_PORT}:8096
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config:/config
      - ${CONFIG_ROOT}/jellyfin/config/index.html:/usr/share/jellyfin/web/index.html
      - ${NAS}:${NAS}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "107"

  komga:
    image: ghcr.io/gotson/komga:1.x
    labels:
      <<: *monitor_updates_only
    <<: *common_service
    environment:
      <<: *common_env
      JAVA_TOOL_OPTIONS: -Xmx1g
    ports:
      - ${KOMGA_PORT}:25600
    volumes:
      - ${CONFIG_ROOT}/komga/config:/config
      - ${CONFIG_ROOT}/komga/data:/data
      - ${CONFIG_ROOT}/komga/tmp:/tmp
      - ${NAS}:${NAS}

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
      WEBUI_PORT: ${QBITTORRENT_PORT_UI}
      TORRENTING_PORT: ${QBITTORRENT_PORT_TRAFFIC}
    ports:
      - ${QBITTORRENT_PORT_UI}:8080
      - ${QBITTORRENT_PORT_TRAFFIC}:6881
      - ${QBITTORRENT_PORT_TRAFFIC}:6881/udp
    volumes:
      - ${CONFIG_ROOT}/qbittorrent/config:/config
      - ${APPS}:${APPS}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${RADARR_PORT}:7878
    volumes:
      - ${CONFIG_ROOT}/radarr/config:/config
      - ${NAS}:${NAS}
      - ${APPS}:${APPS}

  seerr:
    image: ghcr.io/seerr-team/seerr:v3
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
      LOG_LEVEL: debug
    ports:
      - ${SEERR_PORT}:5055
    volumes:
      - ${CONFIG_ROOT}/seerr/config:/app/config

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    labels:
      <<: *auto_update
    <<: *common_service
    environment:
      <<: *common_env
    ports:
      - ${SONARR_PORT}:8989
    volumes:
      - ${CONFIG_ROOT}/sonarr/config:/config
      - ${NAS}:${NAS}
      - ${APPS}:${APPS}

networks:
  homelab_network:
    external: true
