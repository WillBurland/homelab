x-common-env: &common_env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-service: &common_service
  networks:
    - homelab_network
  restart: unless-stopped
  extra_hosts:
    - "authentik.${SERVER_DOMAIN}:${SERVER_IP}"

x-healthcheck-defaults: &healthcheck_defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-watchtower-auto-update: &auto_update
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.cooldown-delay: "24h"

x-watchtower-monitor-only: &monitor_updates_only
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.monitor-only: "true"

x-watchtower-pinned: &pinned_version
  com.centurylinklabs.watchtower.enable: "false"

name: homelab-logging
services:
  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    mac_address: "12:01:01:00:00:00"
    <<: *common_service
    labels:
      <<: *monitor_updates_only
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      <<: *common_env
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "authentik"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "fSrraNAb6yjx7LChfVnDo9dcP3CXr1pPX9gGKrBo"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_AUTH_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authentik.${SERVER_DOMAIN}/application/o/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://authentik-server:9000/application/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://authentik-server:9000/application/o/userinfo/"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://authentik.${SERVER_DOMAIN}/application/o/grafana/end-session/"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_SERVER_ROOT_URL: "https://grafana.${SERVER_DOMAIN}"
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      start_period: 45s
    ports:
      - ${GRAFANA_PORT}:3000
    volumes:
      - ${CONFIG_ROOT}/grafana/data:/var/lib/grafana

  prometheus:
    image: ghcr.io/prometheus/prometheus:v3
    container_name: prometheus
    mac_address: "12:02:01:00:00:00"
    <<: *common_service
    labels:
      <<: *monitor_updates_only
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-admin-api"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=15GB"
      - "--storage.tsdb.wal-compression"
    environment:
      <<: *common_env
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
    ports:
      - ${PROMETHEUS_PORT}:9090
    volumes:
      - ${CONFIG_ROOT}/prometheus/data:/prometheus
      - ${CONFIG_ROOT}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0-omnibus
    container_name: scrutiny
    mac_address: "12:03:01:00:00:00"
    <<: *common_service
    labels:
      <<: *monitor_updates_only
    privileged: true
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
      - /dev/nvme0n1:/dev/nvme0n1
      - /dev/nvme1n1:/dev/nvme1n1
    environment:
      <<: *common_env
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
    ports:
      - ${SCRUTINY_PORT_UI}:8080
      - ${SCRUTINY_PORT_DB}:8086
    volumes:
      - ${CONFIG_ROOT}/scrutiny/config:/config
      - ${CONFIG_ROOT}/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro

  uptime-kuma:
    image: ghcr.io/louislam/uptime-kuma:2
    container_name: uptime-kuma
    mac_address: "12:04:01:00:00:00"
    <<: *common_service
    labels:
      <<: *monitor_updates_only
    environment:
      <<: *common_env
    ports:
      - ${UPTIME_KUMA_PORT}:3001
    volumes:
      - ${CONFIG_ROOT}/uptime-kuma/data:/app/data

networks:
  homelab_network:
    external: true
