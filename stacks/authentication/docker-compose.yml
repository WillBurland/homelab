x-common-env: &common_env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-service: &common_service
  networks:
    - homelab_network
  restart: unless-stopped
  extra_hosts:
    - "authentik.${SERVER_DOMAIN}:${SERVER_IP}"

x-healthcheck-defaults: &healthcheck_defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-watchtower-auto-update: &auto_update
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.cooldown-delay: "24h"

x-watchtower-monitor-only: &monitor_updates_only
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.monitor-only: "true"

x-watchtower-pinned: &pinned_version
  com.centurylinklabs.watchtower.enable: "false"

name: homelab-authentication
services:
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5
    container_name: authentik-server
    mac_address: "0A:01:01:00:00:00"
    <<: *common_service
    labels:
      <<: *pinned_version
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    environment:
      <<: *common_env
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    shm_size: 512mb
    ports:
      - ${AUTHENTIK_PORT_HTTP}:9000
      - ${AUTHENTIK_PORT_HTTPS}:9443
    volumes:
      - ${CONFIG_ROOT}/authentik-server/data:/data
      - ${CONFIG_ROOT}/authentik-server/custom-templates:/templates

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5
    container_name: authentik-worker
    mac_address: "0A:01:02:00:00:00"
    <<: *common_service
    labels:
      <<: *pinned_version
    command: worker
    user: root
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    environment:
      <<: *common_env
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    shm_size: 512mb
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_ROOT}/authentik-worker/data:/data
      - ${CONFIG_ROOT}/authentik-worker/certs:/certs
      - ${CONFIG_ROOT}/authentik-worker/custom-templates:/templates

  authentik-postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgres
    mac_address: "0A:01:03:00:00:00"
    <<: *common_service
    labels:
      <<: *pinned_version
    environment:
      <<: *common_env
      POSTGRES_DB: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_USER: authentik
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
    volumes:
      - ${CONFIG_ROOT}/authentik-postgres/data:/var/lib/postgresql/data

  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    mac_address: "0A:02:01:00:00:00"
    <<: *common_service
    labels:
      <<: *pinned_version
    environment:
      <<: *common_env
    ports:
      - ${VAULTWARDEN_PORT}:80
    volumes:
      - ${CONFIG_ROOT}/vaultwarden/data:/data

networks:
  homelab_network:
    external: true
